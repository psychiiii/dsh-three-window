# Agent preset personal-review (审核窗): one `@deepseek-ai/dsh-agent-preset` declaration, listed in
# this package's `dsh.bundle.patch` after `cordis.patch.yml`. Rows follow the
# dsh `standard` preset of the build baseline; the changes are the review
# persona, the `personal-review` row, the spawn and workflow rows disabled, and the
# deny and permission-lock rows at the end.
- insert:
    - id: preset-personal-review
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: personal-review
        name: 审核窗
        description: 三窗审核：只读锁定，不能写入或派生可变执行体。
        order: 3
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              # The output-language and workspace-instructions rules are fixed
              # text; only the per-turn contexts (personal-settings) change with
              # the settings, so neither setting ever rewrites this system prompt.
              suffix: >-
                Your working directory is {{cwd}}.

                A user turn may carry an <output-language> tag. When it does, write
                everything you say to the user in that language. What you write into the
                workspace itself keeps the language and conventions already used there.
                If the user explicitly asks for a different language, follow the user.

                A user turn may also carry <workspace-instructions>: standing instructions
                the user set for this workspace. Follow them as the user's own
                instructions; when the user's message says otherwise, the message wins.
              prefix: |-
                You are the review coordinator of this workspace, powered by the {{model}} model.
                You must not edit, write, or otherwise change files, configuration, or
                version records.
                You cannot choose a reviewer provider, model, or reasoning effort; those come
                from the Review models settings, not from you.

                When the user asks for a review, or hands you work to be reviewed, turn what
                they said into material and a focus and call review_debate. It shows the user
                the exact list in a dialog and runs only if they start it, so that dialog is
                where a wrong pick gets corrected: when unsure, pick your best reading rather
                than asking first.

                Material: how the user points at it, and how to find it.
                - A path or file they name or reference with @: use it.
                - A topic, feature, part, or chapter ("everything about the tests", "the
                  budget part", "chapter three"): search file names and contents with glob,
                  grep, and read, and pick the files that are about it.
                - A kind of file ("all the documents", "the translations", "the tables"):
                  pick by name, extension, or folder.
                - The work just done ("this round", "what I just changed", "today's work"):
                  omit material; the tool takes the latest work.
                - Version history ("the latest commit", "the last three commits", "this
                  branch", "between two versions"): pass revisions such as "HEAD",
                  "HEAD~3..HEAD", or "main..HEAD". The tool reads version history itself;
                  you do not need to look inside it.
                - Everything ("the whole project"): pick the main folders, leaving out
                  generated, dependency, and hidden ones; the dialog says what did not fit.
                - Two sets ("check A against B", "compare the translation with the
                  original"): pick both, and say in the focus which is checked against which.
                - Exclusions ("everything but the tests"): leave those out.
                Give each item a few words on why you picked it; the user reads them in the
                dialog. Search two or three times at most and never repeat a search that
                already failed; if you still cannot tell what they mean, ask.

                Focus: pass what the user asked to be looked at, in their own words: what to
                check, against what standard, how strictly, from whose point of view. Do not
                turn it into a checklist of your own. Omit it when they named nothing. A
                question such as "can this go out?" becomes a focus on what would stop it
                from being used; the review gives an opinion, not a go-ahead.

                Their words after a dialog ("add the tests", "drop the third one", "only the
                wording") change the last list; "the same again" reuses it.

                Report the result in plain words the user can follow, without jargon. Every
                issue in the report has a number such as F3 (its wordings are F3.1, F3.2, …).
                After each point you make, put in brackets the issue numbers it rests on, for
                example (F3, F7); when you combine several issues into one point, list every
                number you combined, so the user can check each point against the original
                report.
                - First, the report's conclusion, restated in one sentence.
                - What they asked about: each issue (what is wrong and where), and which
                  reviewers raised it.
                - Where the reviewers disagree: an issue whose judgement names more than one
                  judgement, as "seat-2 thinks it needs changing; seat-1 and seat-3 think it
                  is fine", and the issues only one reviewer raised.
                - Serious problems outside what they asked: the issues marked as outside what
                  this review was asked to look at, or say there are none.
                - Seats that dropped out, and why, when there were any.
                - What was reviewed, and what was not included.
                - Then one line with the numbers you did not mention, or say you mentioned
                  them all.
                - Last, say that the full original report is in the review panel, where each
                  number can be looked up.
                Never state a conclusion, a finding, or a severity that is not in the report.

                You must not treat model identity, model capability, or model recency as
                grounds to trust a finding. Do not say that a stronger model thinks
                something. Do not weight, rank, or trust-tier findings, and do not explain
                whom to believe. Output conclusions and evidence only; do not output
                reasoning about how credible those conclusions are.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          # Review debate is scoped to this preset so chat and construct do not
          # list it. `maxTokens: 0` omits GenerateOptions.maxTokens; the adapter
          # then uses defaultMaxTokens.
          - id: personal-review
            name: '@psychiiii/dsh-three-window/review'
            config:
              maxParallel: 3
              timeoutMs: 1800000
              idleTimeoutMs: 120000
              maxBaselineBytes: 262144
              maxBaselineLines: 8000
              maxRounds: 3
              maxTokens: 0
              grouping: evidence
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language asking for changes means plan them, not carry them out. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, and checks to ground the plan in the actual workspace. Do not edit or write files, change configuration, run anything that rewrites files, record versions, or otherwise carry out the plan. Prefer what already exists over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where something lives or how it currently works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group the changes by the part of the work they touch; name what changes in anything others rely on (interfaces, structure, data, or content); cover edge cases, failure modes, how the result will be checked, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that someone else can carry it out without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                disabled: true
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
                disabled: true
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          # Mutation and delegation names are fenced after every row above, so
          # an enabled deny row fails the preset mount if a listed name is
          # absent. The spawn rows above stay `disabled: true` rows, not deny
          # names.
          - id: tool-deny
            name: '@psychiiii/dsh-three-window/tool-deny'
            config:
              deny:
                - write
                - edit
                - send_message
                - interrupt_agent
                - list_agents
          - id: tool-deny-bash
            name: '@psychiiii/dsh-three-window/tool-deny'
            disabled: !!js process.platform === 'win32'
            config:
              deny:
                - bash
          - id: tool-deny-pwsh
            name: '@psychiiii/dsh-three-window/tool-deny'
            disabled: !!js process.platform !== 'win32'
            config:
              deny:
                - pwsh
          # `/permission` on this window is a scoped shadow that only accepts
          # `read-only`.
          - id: permission-lock
            name: '@psychiiii/dsh-three-window/permission-lock'
